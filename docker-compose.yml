services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saas_docs
      POSTGRES_PASSWORD: saas_docs_password
      POSTGRES_DB: saas_docs
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_docs"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://saas_docs:saas_docs_password@postgres:5432/saas_docs?schema=public
      JWT_ACCESS_SECRET: deep-seek-secret
      JWT_REFRESH_SECRET: deep-seek-refresh
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data: