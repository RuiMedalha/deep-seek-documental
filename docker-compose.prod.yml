services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saas_docs
      POSTGRES_PASSWORD: saas_docs_password
      POSTGRES_DB: saas_docs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_docs"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://saas_docs:saas_docs_password@postgres:5432/saas_docs?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: 
      JWT_REFRESH_SECRET: 
      PORT: 4000
      FRONTEND_URL: 
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: 
    depends_on:
      - api

volumes:
  postgres_data:
